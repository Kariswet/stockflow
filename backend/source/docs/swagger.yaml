definitions:
  dto.OrderCreateRequest:
    properties:
      customer:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.OrderItemRequest'
        minItems: 1
        type: array
    required:
    - customer
    - items
    type: object
  dto.OrderItemRequest:
    properties:
      qty:
        type: integer
      sku:
        type: string
    required:
    - qty
    - sku
    type: object
  dto.ProductRequest:
    properties:
      name:
        type: string
      price:
        minimum: 0
        type: integer
      sku:
        type: string
    required:
    - name
    - price
    - sku
    type: object
  dto.ProductUpdateRequest:
    properties:
      is_active:
        type: boolean
      name:
        type: string
      price:
        minimum: 0
        type: integer
      sku:
        type: string
    type: object
  dto.StockMovementRequest:
    properties:
      note:
        type: string
      qty:
        type: integer
      type:
        enum:
        - in
        - out
        type: string
    required:
    - qty
    - type
    type: object
  model.MetadataResponse:
    properties:
      message:
        type: string
      status:
        type: boolean
      time_execution:
        type: string
    type: object
  model.PaginatedResponse:
    properties:
      data: {}
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
  description: stockflow documentation
  title: stockflow
  version: "1.0"
