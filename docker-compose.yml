version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: stockflow_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stockflow
    ports:
      - "5432:5432"
    volumes:
      # Melakukan inject init.sql agar dijalankan otomatis saat DB pertama kali hidup
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build: 
      context: ./backend 
      dockerfile: Dockerfile
    container_name: stockflow_api
    ports:
      - "8080:8080" 
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: stockflow
      DB_PORT: 5432
    depends_on:
      - db
    restart: unless-stopped